<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фиолетовый фон -->
  <rect width="256" height="256" rx="60" fill="url(#bgGradient)"/>
  
  <!-- Золотая монета -->
  <circle cx="128" cy="128" r="90" fill="url(#coinGradient)"/>
  <circle cx="128" cy="128" r="75" fill="none" stroke="#FFA500" stroke-width="4"/>
  
  <!-- Символ -->
  <text x="128" y="165" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="#FFA500" text-anchor="middle">🪙</text>
  
  <!-- Звездочки -->
  <text x="50" y="60" font-size="24">✨</text>
  <text x="190" y="60" font-size="24">✨</text>
  <text x="50" y="210" font-size="24">✨</text>
  <text x="190" y="210" font-size="24">✨</text>
  
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coinGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
  </defs>
</svg>
